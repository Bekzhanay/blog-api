[tool.ruff]
line-length = 79
target-version = "py311"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "settings"]

section-order = ["future", "standard-library", "third-party", "restframework", "django", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
restframework = ["rest_framework", "rest_framework_simplejwt"]
django = ["django"]

[tool.ruff.lint.per-file-ignores]
"settings/env/*.py" = ["F403", "F405"]